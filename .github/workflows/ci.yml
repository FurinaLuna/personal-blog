name: CI

# 说明：本仓库的 CI 曾连续 5 次全部失败，排查后发现与代码无关——
# 注解里写的是 "The job was not started because your account is locked due to a
# billing issue."，即账号级账单锁，job 在启动前就被拒（steps 为空、2 秒内结束）。
# 判别方法：`gh api repos/{owner}/{repo}/check-runs/{id}/annotations` 看注解；
# 若注解提到 billing/locked，先去 Settings → Billing 处理，别改代码。
# 详细记录见 docs/devlog/2026-09-12.md。
#
# CI 不可用时的本地等价验证（缺一不可）：
#   make check    # ruff + 格式 + 后端测试 + 前端类型 + 前端单测
#   make build    # 前端生产构建
#   make smoke    # 真实浏览器冒烟（需先 make dev）
#   make interaction  # 真实点击的交互验证（需先 make dev）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限：CI 只需要读代码。默认的 GITHUB_TOKEN 权限可能包含写，收敛它能降低
# 「流水线里某个依赖被投毒后反向修改仓库」的风险。
permissions:
  contents: read

# 同一分支连续推送时取消上一次仍在跑的流水线，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · lint + 测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      # 用锁文件而不是 `pip install -e ".[dev]"`：后者只给了下界，
      # 同一个提交在不同时间会装出不同的环境 —— 本项目实际已经漂到
      # bcrypt 5.0 / aiosmtplib 5.1 / pytest 9.1，而 pyproject 里写的是 4.2 / 3.0 / 8.3。
      # --no-deps 之后再单独装项目本身，避免 pip 又去解析一遍范围。
      - name: 安装依赖（锁定版本）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Ruff 静态检查
        run: ruff check .

      - name: Ruff 格式检查
        run: ruff format --check .

      # 分层契约走 backend/scripts/lint_imports.py 包装而不是裸 lint-imports：
      # .importlinter 里是中文，裸命令在非 UTF-8 locale 下会直接读不出文件。
      # 用同一个入口，本地与 CI 的行为才一致（这里 locale 虽然是 UTF-8，
      # 但走包装能顺带验证包装本身没坏）。
      - name: 分层契约（import-linter）
        run: python scripts/lint_imports.py

      # 带 --cov：覆盖率门槛写在 pyproject 的 [tool.coverage.report] fail_under = 80。
      # 不带 --cov 时门槛不生效，所以这里必须带，否则它就只是一行注释。
      - name: pytest（含覆盖率门槛）
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: 前端 · 类型 + 单测 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci 而不是 install：严格按 lockfile 安装，保证 CI 与本地一致。
      # 若 package.json 与 lock 不同步，这一步会直接失败（这是特性，不是缺点）
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run type-check

      - name: ESLint（bug 与无障碍）
        run: npm run lint

      - name: 单元测试
        run: npm run test

      - name: 生产构建
        run: npm run build:only

  migration:
    name: 迁移 · 升降级可用性
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      # 迁移不能只在"升级"那一步可用：线上出问题时要能干净回滚
      - name: 升级到 head
        run: alembic upgrade head
        env:
          APP_ENV: testing
          JWT_SECRET_KEY: ci-only-secret-key-not-for-production
          DATABASE_URL: sqlite+aiosqlite:///./ci_migration.db
          SEED_DEMO_DATA: 'false'

      - name: 回滚到 base
        run: alembic downgrade base
        env:
          APP_ENV: testing
          JWT_SECRET_KEY: ci-only-secret-key-not-for-production
          DATABASE_URL: sqlite+aiosqlite:///./ci_migration.db
          SEED_DEMO_DATA: 'false'

  e2e-live:
    # tools/e2e_live 是本仓库最强的一张回归网（SQLite 62 条 / PG 61 条，
    # 每条都真起进程、真走 HTTP、真直连数据库复核），但它此前**只在作者本机跑过**：
    # e2e_run.py 里写死了 `backend/.venv/Scripts/python.exe`——一个 Windows 专有路径，
    # Linux runner 上连启动都会 FileNotFoundError。也就是说，"最强防线"恰恰是
    # 唯一没被自动化执行的那条。
    #
    # 这一版把解释器改成 sys.executable 之后，脚本在任何装了 requirements.lock 的
    # 环境里都能跑。SQLite 方言不需要任何外部服务，所以直接进 CI；
    # PG 方言由 backend-postgres job（pytest 跑在真 PG 上）与本地
    # `E2E_DB=postgres` 两级覆盖。
    name: 端到端 · 真实链路（SQLite 方言）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: 安装依赖（锁定版本）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      # 脚本自己起 uvicorn、自己用 alembic upgrade head 建库、自己清理，
      # 不需要 service、也不需要预先起任何进程。
      - name: 执行端到端用例（SQLite）
        working-directory: .
        env:
          E2E_DB: sqlite
        run: python tools/e2e_live/e2e_run.py

      # 报告默认写在 tools/e2e_live/reports/（gitignore），失败时上传才能看到
      # 逐用例的失败原因与复现步骤。
      - name: 上传报告（失败现场）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-report
          path: tools/e2e_live/reports/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    # 依赖漏洞是"上线时才发现、但上线前就能查出来"的典型。前端有 npm audit
    # 的记录，后端此前完全没有 —— 这个 job 补上那半边。
    #
    # 单独成 job 而不是塞进 backend job：漏洞公告随时会新增，
    # 让它失败时一眼能看出是"依赖有洞"而不是"代码挂了"。
    name: 依赖 · 漏洞审计
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 刻意不把它加进 requirements.lock：安全扫描器需要**最新的漏洞库**，
      # 把它钉死在某个版本反而会漏掉新公告。它是 CI 工具，不是运行时依赖。
      - name: 安装 pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # 审计的是锁文件 —— 也就是 CI 与生产镜像真正安装的那套版本。
      # 拿 pyproject 的范围去审计没有意义（那只是一个区间）。
      - name: 审计后端依赖（requirements.lock）
        working-directory: backend
        run: pip-audit -r requirements.lock --strict

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 前端用 lock 文件审计生产依赖；devDependencies 的漏洞不影响产物，
      # 但 npm audit 默认会一起报，用 --omit=dev 聚焦真正会进产物的那些。
      - name: 审计前端依赖（package-lock.json）
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # 为什么端到端必须进 CI：
    # 这个仓库里出现过的几个真实缺陷——「登录后被弹回登录页」「后台侧边栏渲染两遍」
    # 「文章间跳转后目录失效」——都有一个共同特征：类型检查全绿、单元测试全过、
    # 构建成功，只有真正打开浏览器才会暴露。它们此前只在本地跑，
    # 等于最值钱的那张回归网没有接到流水线上。
    name: 端到端 · 真实浏览器（smoke + interaction + full-check）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 启动后端
        working-directory: backend
        env:
          # testing 而不是 production：生产门禁会（正确地）拒绝
          # CI 里这些占位密钥，那不是这里要测的东西。
          APP_ENV: testing
          DEBUG: 'false'
          JWT_SECRET_KEY: ci-only-secret-key-not-for-production
          DATABASE_URL: sqlite+aiosqlite:///./ci_e2e.db
          # 冒烟脚本断言「首页 4 篇演示文章」，所以必须灌演示数据
          SEED_DEMO_DATA: 'true'
          ADMIN_PASSWORD: admin123456
          # 关掉限流：smoke 与 interaction 背靠背跑，登录次数会超过 5 次/分，
          # 触发 429 造成与代码无关的抖动。限流行为本身由 pytest 的
          # test_ratelimit.py 覆盖，这里不需要重复验证。
          RATE_LIMIT_ENABLED: 'false'
        run: |
          nohup python -m uvicorn app.main:app --app-dir src --port 8000 \
            > /tmp/backend.log 2>&1 &

      - name: 启动前端
        working-directory: frontend
        run: |
          nohup npm run dev > /tmp/frontend.log 2>&1 &

      - name: 等待服务就绪
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1; then
              echo "两个服务都已就绪（等待 ${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "::error::服务在 60s 内没有就绪"
          echo "----- backend.log -----"; tail -50 /tmp/backend.log
          echo "----- frontend.log -----"; tail -50 /tmp/frontend.log
          exit 1

      - name: 冒烟验证（只读，逐页渲染与关键交互）
        run: node tools/smoke-check.mjs http://127.0.0.1:5173 ./shots/smoke

      - name: 交互验证（真实点击的失败路径与写操作）
        run: node tools/interaction-check.mjs ./shots/interaction

      # 全功能回归：后台写操作生命周期 + 列表边界 + 详情页交互 + 数据基线核对。
      # 它会写数据但自清理；CI 的库本来就是一次性的，结束时核对基线正好。
      - name: 全功能回归（写操作生命周期 + 数据基线核对）
        run: node tools/full-check.mjs http://127.0.0.1:5173 ./shots/full

      # 失败时的现场比日志有用得多：截图能直接看出是渲染问题还是数据问题
      - name: 上传失败现场（截图与报告）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: shots/
          retention-days: 7
          if-no-files-found: ignore

      - name: 失败时输出服务日志
        if: failure()
        run: |
          echo "----- backend.log -----"; tail -100 /tmp/backend.log || true
          echo "----- frontend.log -----"; tail -100 /tmp/frontend.log || true

