name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支连续推送时取消上一次仍在跑的流水线，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · lint + 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff 静态检查
        run: ruff check .

      - name: Ruff 格式检查
        run: ruff format --check .

      - name: pytest
        run: pytest -q

  frontend:
    name: 前端 · 类型 + 单测 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci 而不是 install：严格按 lockfile 安装，保证 CI 与本地一致
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run type-check

      - name: 单元测试
        run: npm run test

      - name: 生产构建
        run: npm run build:only

  migration:
    name: 迁移 · 升降级可用性
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 迁移不能只在"升级"那一步可用：线上出问题时要能干净回滚
      - name: 升级到 head
        run: alembic upgrade head
        env:
          APP_ENV: testing
          JWT_SECRET_KEY: ci-only-secret-key-not-for-production
          DATABASE_URL: sqlite+aiosqlite:///./ci_migration.db
          SEED_DEMO_DATA: 'false'

      - name: 回滚到 base
        run: alembic downgrade base
        env:
          APP_ENV: testing
          JWT_SECRET_KEY: ci-only-secret-key-not-for-production
          DATABASE_URL: sqlite+aiosqlite:///./ci_migration.db
          SEED_DEMO_DATA: 'false'
