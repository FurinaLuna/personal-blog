# 后端依赖锁定（全部传递依赖的精确版本）
#
# 用途：CI 与 Docker 构建用它安装，保证「同一个提交在任何时间、任何机器上
# 装出同一套依赖」。pyproject.toml 里的范围是给人和 pip 看的意图声明，
# 这里是给构建用的确定答案。
#
# ## 怎么更新
#
#   在**全新的** venv 里装一次 extras，再冻结：
#
#     python -m venv .lockvenv
#     .lockvenv/Scripts/python -m pip install ".[postgres,dev]"
#     .lockvenv/Scripts/python -m pip freeze --exclude-editable #       | grep -viE "^personal-blog-backend" | sort -f > requirements.lock
#     rm -rf .lockvenv
#
#   用新 venv 而不是复用开发环境：开发环境里可能装着调试用的额外包，
#   冻进去会让锁文件带上并非项目依赖的东西。
#
# ## 什么时候该更新
#
#   只有**显式升级依赖**时。改了 pyproject.toml 的范围就要同步重生成，
#   否则 CI 用的是旧版本，本地却装新的 —— 那种不一致比不锁还难查。
#
# ## 注意
#
#   含 postgres extra（asyncpg），因为它只在生产容器里用得上，
#   而生产镜像正是靠这份锁构建的。

