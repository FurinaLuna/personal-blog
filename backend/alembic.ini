# Alembic configuration for personal-blog.
#
# NOTE: keep this file ASCII-only.
# Alembic reads alembic.ini via configparser with encoding="locale".
# On Windows that resolves to GBK, so any non-ASCII comment here makes
# every alembic command fail with UnicodeDecodeError. Explained in docs/DESIGN.md.

[alembic]
script_location = alembic

# Make `app` importable when alembic runs from the backend/ directory.
prepend_sys_path = src

version_path_separator = os

# Migration filenames are prefixed with a timestamp so that sorting files
# by name equals sorting them by time.
#
# No `timezone = ...` here on purpose: that option needs IANA tzdata, which is
# not present in a default Windows Python install and makes every alembic
# command fail with "Can't locate timezone". Local time in the filename is fine.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# The database URL is intentionally NOT set here.
# alembic/env.py reads it from the application settings so that migrations
# and the running app always target the same database. Hardcoding it here is
# the classic cause of "migration succeeded but the app says table missing".

[post_write_hooks]
# Format generated migrations so they match the rest of the codebase.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
