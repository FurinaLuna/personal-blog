# 个人博客 · 一键启动
#
#   cp .env.example .env        # ← 项目根目录，不是 backend/.env
#   vim .env                    # 填 POSTGRES_PASSWORD / JWT_SECRET_KEY / ADMIN_PASSWORD
#   docker compose up -d --build
#
#   前端 http://localhost:8080  （后端只经它反代，见文末「不发布 8000」那段）
#
# 起起来之后会有四样东西：db（不对宿主暴露）、backup（每天往 ./backups 落一份
# dump）、backend（不发布端口）、frontend（唯一对外的入口）。
#   APP_PORT=18080 docker compose up -d     # 8080 被占用时换端口
#   docker compose logs -f backup           # 看备份有没有在跑
#   -f docker-compose.tls.yml               # 叠上 TLS（自管证书），见该文件顶部
#
# ── 为什么配置源是**项目根目录**的 .env ─────────────────────────────
# compose 的 ${VAR} 变量插值只读「项目根目录的 .env」和当前 shell 环境，
# **不读**服务的 env_file。所以把配置写在 backend/.env 里，
# ${POSTGRES_PASSWORD} 依然取不到值，`docker compose up` 会直接报
# 「required variable POSTGRES_PASSWORD is missing」。为了让「插值」和
# 「容器内配置」只有一个来源，backend 服务的 env_file 也指向同一个根 .env。
#
# 裸机开发（直接跑 uvicorn / vite）仍然用 backend/.env，两者互不影响。

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      # :? 的写法让「没配密码」在 up 阶段就失败，而不是起一个空口令的库。
      # compose 对未定义变量默认是**静默换成空字符串**，而数据库恰好是
      # 那个「不对公网暴露、所以更不能空口令」的组件。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在项目根目录 .env 中设置 POSTGRES_PASSWORD（cp .env.example .env）}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
      # 中文排序与大小写行为更可预期
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # backend 依赖这个健康检查，避免"数据库还没起来应用就连"导致启动失败
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blog} -d ${POSTGRES_DB:-blog}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 数据库不对公网暴露，只在 compose 网络内可达
    expose:
      - "5432"

  backup:
    # 定时备份：每 BACKUP_INTERVAL_SECONDS 秒 pg_dump 一次到宿主 ./backups。
    #
    # 用 db 那**同一个镜像**（而不是新建一个小镜像）：pg_dump 的版本必须 >= 服务端
    # 版本，同镜像让这条约束天然成立，也省掉一次构建。
    # 脚本是挂载进去的（不是 COPY 进镜像），所以改备份逻辑不需要重新 build，
    # 且 compose 之外也能单独 shellcheck 它。
    image: postgres:16-alpine
    restart: unless-stopped
    # 覆写 entrypoint：镜像自带的 docker-entrypoint.sh 会在 CMD 是 postgres 时
    # 初始化一个数据库集群 —— 这里要的只是一个 pg_dump 客户端，不是第二个数据库。
    entrypoint: ["/bin/sh", "/backup.sh"]
    # 清空镜像自带的 CMD（"postgres"）：不清的话它会作为参数追加到 entrypoint 后面，
    # 脚本虽然不读参数，但 `docker inspect` 里会留下一段像是"要起数据库"的配置。
    command: []
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-blog}
      PGPASSWORD: ${POSTGRES_PASSWORD:?请在项目根目录 .env 中设置 POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-blog}
      BACKUP_DIR: /backups
      # 与 backup_db.py 的 --keep 默认值保持一致
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      TZ: Asia/Shanghai
      # 想手动触发一次（不启动常驻循环）：BACKUP_ONCE=1 docker compose run --rm backup
    volumes:
      # 必须绑到宿主：备份留在 docker 卷里等于"备份和库一起丢"，
      # 而且没法 scp 到别的机器。目录内容已在 .gitignore 里排除。
      # 路径可覆盖（BACKUP_HOST_DIR=/mnt/backup/blog），也正是让回归脚本
      # 能在临时目录里跑完整备份+恢复演练、而不污染真实备份目录的办法。
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    depends_on:
      db:
        # 库没起来时 pg_dump 只会失败一堆，等健康检查通过更省事
        condition: service_healthy
      backend:
        # 还要等 **backend 健康**：它的入口会先跑 `alembic upgrade head`，
        # 健康检查通过就等于"结构已经建好"。只等 db 的话，全新部署的第一份备份
        # 会赶在迁移之前落盘 —— 那是一个**结构为空但格式合法**的 dump
        # （实测 0.8 KB、恢复出来 0 张表），比备份失败更危险：
        # 它静静地躺在备份目录里，看起来"有备份"。
        #
        # 这与 backup.sh 里那道"没有 alembic_version 就跳过本轮"的检查是**双保险**：
        # 后者覆盖"后端先起来、迁移稍后才做"的部署方式
        # （RUN_MIGRATIONS_ON_STARTUP=false 时健康检查会先通过）。
        condition: service_healthy
    # 刻意不发布任何端口：它不在请求路径上，只需要能连到 db。
    # 对 backend 的依赖只用于**启动顺序**（等迁移完成），起来之后两者互不影响。

  backend:
    build:
      context: ./backend
      dockerfile: ../deploy/Dockerfile.backend
    restart: unless-stopped
    env_file:
      # 与插值用的是同一个文件：配置只有一个来源，不会出现「.env 改了、
      # 容器里还是旧值」这种最难查的分裂状态。
      - ./.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-blog}:${POSTGRES_PASSWORD:?请在项目根目录 .env 中设置 POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-blog}
      STORAGE_DIR: /app/storage
      TZ: Asia/Shanghai

      # ── 部署默认按生产来 ───────────────────────────────────────
      # 容器里跑的就是对外服务的实例，而 backend/.env 那套
      # APP_ENV=development / DEBUG=true / DB_AUTO_CREATE=true 的开发默认值
      # 一旦被带进来，就等于「以开发模式对外服务」：/docs 敞开、异常带堆栈、
      # 改错模型会在生产库上静默改表。
      # 这里逐个写死安全侧的默认值；想在本机用 docker 试玩，在根 .env 里
      # 显式覆盖即可（environment 的值来自插值，所以 .env 依然说了算）。
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      # 表结构改由容器入口的 `alembic upgrade head` 负责
      # （backend/scripts/docker-entrypoint.sh），不再用 create_all ——
      # 否则「应用自动建表」和「迁移」两条路径会撞车，把 alembic 卡在一个
      # 一重放就报「表已存在」的状态。
      DB_AUTO_CREATE: ${DB_AUTO_CREATE:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}

      # ── 密钥：缺失就 fail fast ─────────────────────────────────
      # 应用侧还有一道 check_production_safety() 兜底，但那要等容器起来才报错，
      # 表现出来是 restart 循环 + 得翻容器日志才知道原因；这里更早、更直白。
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请在项目根目录 .env 中设置 JWT_SECRET_KEY（用 openssl rand -hex 32 生成）}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在项目根目录 .env 中设置 ADMIN_PASSWORD（管理员初始口令，不能用仓库里的默认值）}

      # ── 对外地址 ───────────────────────────────────────────────
      # 应用默认值指向 Vite 的 5173，在 docker 拓扑里是错的（前端在 8080），
      # 会让 RSS / sitemap / 通知邮件里的绝对链接全都指向一个不存在的地址。
      # 上线时在根 .env 里改成正式域名。
      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}

      # 后端确实部署在 nginx（frontend 容器）之后，所以**必须**打开它，
      # 否则取到的是 nginx 容器的 IP —— 全网共用一个限流桶，
      # 一个脚本就能把所有人的登录和评论锁死，UV 统计也恒为 1。
      #
      # 信任判定只在这一处：镜像里已用 --no-proxy-headers 关掉了 uvicorn
      # 自己的代理头处理，避免两个开关打架（见 deploy/Dockerfile.backend）。
      TRUST_PROXY_HEADERS: "true"
    volumes:
      # 媒体文件必须挂出来，否则容器重建就全丢了
      - mediadata:/app/storage
    depends_on:
      db:
        condition: service_healthy
    # 刻意**不**发布 8000 端口。
    # 后端只应通过 frontend 容器（nginx）从 compose 内网访问：
    # 一旦映射到宿主机，任何人都能绕过 nginx 直连后端，
    # 而 nginx 那一层的限流、CSP、安全响应头就全部失效了。
    # 需要调试时用 `docker compose exec backend curl 127.0.0.1:8000/health`，
    # 或临时加 `ports: ["127.0.0.1:8000:8000"]`（只绑本机回环，不要写 0.0.0.0）。
    #
    # 顺带一提：所以 `/docs` 在容器里是够不到的（nginx 也没有为它开 location），
    # 而 APP_ENV=production 本来就会关掉它 —— 想看接口文档请跑裸机模式。
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/Dockerfile.frontend
      # nginx.conf 在 deploy/ 下，而构建上下文是 frontend/ —— 上下文之外的
      # 文件 COPY 不到（写成 `COPY deploy/nginx.conf` 会直接构建失败）。
      # 用 additional_contexts 把 deploy/ 也挂进来，而不是把配置复制一份进
      # frontend/：两份配置迟早漂移，而「改了没生效」在 nginx 上代价很高。
      # 需要 compose v2.17+ / BuildKit（Docker Desktop 默认满足）。
      additional_contexts:
        deploy: ./deploy
      args:
        VITE_API_BASE_URL: /api/v1
        # 选哪套 nginx 主配置：默认纯 HTTP；TLS 部署由 docker-compose.tls.yml 覆盖。
        # 两套共用同一份 server 体（deploy/nginx-server.inc），不会漂移。
        NGINX_CONF: ${NGINX_CONF:-nginx.conf}
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      # ACME HTTP-01 的 webroot：自管证书时 certbot 往这里写挑战文件，
      # 由 nginx-server.inc 里的 /.well-known/acme-challenge/ 吐出去。
      # 纯 HTTP 与 TLS 两种部署都用它（TLS 版的 80 端口只做挑战与跳转），
      # 平时是个空目录，留着免得启用证书时还得回头改 compose。
      - ${CERTBOT_WEBROOT:-./certbot-webroot}:/var/www/certbot
    ports:
      # APP_PORT 可覆盖：既为了"宿主 8080 已被别的服务占用"这种情况，
      # 也让回归脚本能在不干扰开发者本地已跑起来的那套栈的前提下另起一套
      # （tools/deploy-check.mjs 用 18080）。改了端口记得同步 .env 里的
      # SITE_BASE_URL / CORS_ORIGINS，否则 RSS 与 sitemap 里的绝对地址会指错。
      - "${APP_PORT:-8080}:80"

volumes:
  pgdata:
    driver: local
  mediadata:
    driver: local
