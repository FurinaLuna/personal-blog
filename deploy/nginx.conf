# 个人博客 Nginx 配置
#
# 职责：静态资源直出与缓存、SPA history 路由回退、/api 与 /media 反向代理。

# HSTS 的取值必须是**条件式**的。
#
# 这个头只在 HTTPS 下才有意义，而本仓库的 nginx 只监听 80
# （TLS 由外层终止：Cloudflare / 宿主机 Caddy / 云负载均衡，见 README「HTTPS」）。
# 如果无条件发 `Strict-Transport-Security`，一个纯 HTTP 的部署会把
# "以后只能用 HTTPS 访问本站"写进每个访客的浏览器，而它根本没有证书 ——
# 等于用一行配置把站点锁死，且**无法从服务端撤除**（只能等 max-age 过期）。
#
# 所以按 X-Forwarded-Proto 判断：外层真的是 HTTPS 才发。
# nginx 的 add_header 在值为空字符串时**不会**发出该头，正是这里要的行为。
map $http_x_forwarded_proto $hsts_header {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

upstream blog_backend {
    # 使用 Docker Compose 的服务名；裸机部署改成 127.0.0.1:8000
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 必须与后端的 MAX_UPLOAD_SIZE 保持一致。
    # 只改后端不改这里的话，大文件会在 Nginx 层就被 413 拦掉，
    # 而后端日志里什么都看不到，是最容易浪费时间的一类"灵异问题"。
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        application/rss+xml image/svg+xml;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 只有外层是 HTTPS 时才非空 ⇒ 只有 HTTPS 部署才会发出（见文件顶部的 map）
    add_header Strict-Transport-Security $hsts_header always;
    # CSP 刻意留得比较宽松：正文里可能出现任意外链图片。
    # 但 script-src 只允许同源，这是防 XSS 的最后一道防线。
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'"
        always;

    # ---------- 带指纹的静态资源：长缓存 ----------
    # Vite 产物文件名里带 hash，内容变了文件名就变，可以放心 immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 30d;
        access_log off;
    }

    # ---------- 媒体文件 ----------
    # 反代到后端由 StaticFiles 提供（这样本地磁盘/对象存储的切换对 Nginx 透明）
    location /media/ {
        proxy_pass http://blog_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传的图片都是不可变的（文件名含随机串），可以长缓存
        expires 30d;
        add_header Cache-Control "public";
        # 防止上传的 SVG/HTML 被浏览器按脚本执行（后端已禁用这两类，这里是双保险）
        add_header X-Content-Type-Options "nosniff";
    }

    # ---------- API ----------
    location /api/ {
        proxy_pass http://blog_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端靠这个头拿真实客户端 IP（评论记录 IP、将来做限流都要用）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 上传接口不要缓存
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://blog_backend;
        access_log off;
    }

    # RSS / sitemap 由后端生成（内容随发文变化），直连后端并允许短缓存
    location = /feed.xml {
        proxy_pass http://blog_backend;
        proxy_cache_valid 200 1h;
    }

    location = /sitemap.xml {
        proxy_pass http://blog_backend;
        proxy_cache_valid 200 1h;
    }

    # ---------- SPA 路由回退 ----------
    # Vue Router 用 history 模式，像 /article/xxx 这种路径在磁盘上并不存在，
    # 必须回退到 index.html 交给前端路由处理，否则刷新页面就是 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不能缓存，否则前端发版后用户仍会加载旧的 JS 引用
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ /\. {
        deny all;
    }
}
