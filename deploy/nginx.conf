# 个人博客 Nginx 配置（**纯 HTTP 版**，默认）
#
# 职责：静态资源直出与缓存、SPA history 路由回退、/api 与 /media 反向代理。
#
# 本文件只是一个"外壳"：站点内容在 nginx-server.inc（两套外壳共用），
# upstream 在 nginx-common.inc，安全响应头在 security-headers.inc。
# 想启用仓库自带的 HTTPS（自管证书）：用 docker-compose.tls.yml 起，
# 它会换成 nginx.https.conf，流程见 README「HTTPS」。
#
# HSTS 的取值必须是**条件式**的。
#
# 这个头只在 HTTPS 下才有意义，而本文件这套配置只监听 80
# （TLS 由外层终止：Cloudflare / 宿主机 Caddy / 云负载均衡，见 README「HTTPS」）。
# 如果无条件发 `Strict-Transport-Security`，一个纯 HTTP 的部署会把
# "以后只能用 HTTPS 访问本站"写进每个访客的浏览器，而它根本没有证书 ——
# 等于用一行配置把站点锁死，且**无法从服务端撤除**（只能等 max-age 过期）。
#
# 所以按 X-Forwarded-Proto 判断：外层真的是 HTTPS 才发。
# nginx 的 add_header 在值为空字符串时**不会**发出该头，正是这里要的行为。
# （nginx.https.conf 里的那份 map 是无条件的 —— 那一套自己就终止 TLS。）
map $http_x_forwarded_proto $hsts_header {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

include /etc/nginx/conf.d/nginx-common.inc;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/nginx-server.inc;
}
