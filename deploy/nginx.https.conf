# 个人博客 Nginx 配置（**自管证书的 HTTPS 版**，可选）
#
# 怎么启用：叠加 compose 覆盖文件，不要手改本文件
#
#     # 1) 先按纯 HTTP 起一次（webroot 目录会被挂进容器）
#     docker compose up -d --build
#
#     # 2) 用 certbot 的容器签发证书，产物直接落到宿主 ./deploy/certs
#     docker run --rm \
#       -v "$PWD/certbot-webroot:/webroot" \
#       -v "$PWD/deploy/certs:/etc/letsencrypt" \
#       certbot/certbot certonly --webroot -w /webroot \
#       -d example.com --email you@example.com --agree-tos --no-eff-email
#
#     # 3) 换成 HTTPS 版（会带上 443 端口与证书目录）
#     docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
#     # 4) 续期：宿主 cron 里跑 certbot renew，然后让 nginx 重新读证书
#     #    0 3 * * * cd /srv/personal-blog && docker run --rm -v "$PWD/certbot-webroot:/webroot" \
#     #      -v "$PWD/deploy/certs:/etc/letsencrypt" certbot/certbot renew --quiet \
#     #      && docker compose -f docker-compose.yml -f docker-compose.tls.yml exec -T frontend nginx -s reload
#
# certbot 的标准输出布局就是 live/<域名>/，所以下面两行 ssl_certificate* 里
# 只需要把 `example.com` 换成你的域名 —— 这是启用 TLS 唯一必须改的地方。
#
# 若 TLS 由外层（Cloudflare / Caddy / 云负载均衡）终止，**不要**用本文件：
# 用默认的 nginx.conf，把 TRUST_PROXY_HEADERS 保持开启即可（见 README「HTTPS」）。

# HTTPS 版自己就是 TLS 终点，所以 HSTS 是**无条件**的 —— 这里不会出现
# nginx.conf 里那个"纯 HTTP 部署被 HSTS 锁死"的风险（那套靠 X-Forwarded-Proto 判断）。
#
# includeSubDomains 的含义再强调一次：它会把"该域名**及其所有子域**只能用 HTTPS"
# 写进访客浏览器。本站只有这一个域名就没事；同一域名下还挂着别的纯 HTTP 服务
# （nas.、git. 之类）时，请把 includeSubDomains 去掉。
map $http_x_forwarded_proto $hsts_header {
    default "max-age=31536000; includeSubDomains";
}

include /etc/nginx/conf.d/nginx-common.inc;

# ---------- 80：只做 ACME 挑战 + 跳转到 HTTPS ----------
server {
    listen 80;
    server_name _;

    # 续期用的挑战路径必须留在 80 且**不能**被跳转吃掉。
    # 注意这里用的是 location 级 return，而不是 server 级的 `return 301 ...`：
    # server 级 return 属于 rewrite 阶段，会在 location 匹配**之前**执行，
    # 于是挑战请求也被 301 掉 —— certbot 只会报"校验失败"，不会说被自己重定向了。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：站点本体 ----------
server {
    listen 443 ssl;
    # nginx 1.25.1+ 的写法；`listen 443 ssl http2` 已废弃（会打 deprecation 警告）
    http2 on;
    server_name _;

    # 路径由 docker-compose.tls.yml 从宿主 ./deploy/certs 只读挂入
    ssl_certificate     /etc/nginx/certs/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # 让客户端选：TLS1.3 本来就不支持服务端偏好
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # 会话票据关掉：票据密钥轮换不当会削弱前向安全性，
    # 而 session cache 已经覆盖了"避免完整握手"这个目的。
    ssl_session_tickets off;
    # 刻意不开 OCSP stapling（ssl_stapling）：它需要额外的 resolver 与真实 CA 链，
    # 在本机自签证书的验证环境里只会刷出 "issuer certificate not found"，
    # 收益（省一次 OCSP 查询）远小于配置复杂度。

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/nginx-server.inc;
}
